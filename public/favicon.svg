<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#17843f" stroke-width="1.6"/>
    </pattern>
    <clipPath id="lens">
      <circle cx="24" cy="32" r="16"/>
    </clipPath>
  </defs>
  <circle cx="24" cy="32" r="16" fill="none" stroke="#17843f" stroke-width="2.6"/>
  <circle cx="41" cy="32" r="16" fill="none" stroke="#17843f" stroke-width="2.6"/>
  <circle cx="41" cy="32" r="16" fill="url(#hatch)" clip-path="url(#lens)"/>
</svg>
